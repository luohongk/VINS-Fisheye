%YAML:1.0

#==========================================================
# Auto-generated by kalibr_to_vins.py — DO NOT EDIT BY HAND.
# Re-run the script to refresh.
#
# Camera pair selected: cam0 + cam1
# IMU topic           : /imu_data_raw
# Source bag topics   : /fisheye/left/image_raw / /fisheye/right/image_raw
# VINS subscribes to  : /fisheye/left/image_padded / /fisheye/right/image_padded
# Compressed input    : False
# Padding             : top=360 bottom=360 left=0 right=0
#                       (pad_fisheye_node.py rebuilds the symmetric fisheye)
# is_fisheye          : 1  (1 = dual-fisheye spherical mode;
#                       this fork only implements the is_fisheye:1 path —
#                       the is_fisheye:0 branch in estimator.cpp is empty
#                       and segfaults at runtime.)
#==========================================================

#common parameters
imu: 1
num_of_cam: 2

is_fisheye: 1

imu_topic: "/imu_data_raw"

# Raw image topics (used when is_compressed_images:0)
image0_topic: "/fisheye/left/image_padded"
image1_topic: "/fisheye/right/image_padded"

# Compressed image topics (used when is_compressed_images:1)
is_compressed_images: 0
compressed_image0_topic: "/fisheye/left/image_padded/compressed"
compressed_image1_topic: "/fisheye/right/image_padded/compressed"

output_path: "/home/lhk/output"

cam0_calib: "cam0_mei.yaml"
cam1_calib: "cam1_mei.yaml"

# image_width/height here are the FLATTENED virtual-pinhole sub-image
# dimensions (used as WIDTH inside FisheyeUndist), NOT the input fisheye
# resolution. Recommended 300-600 for VIO. The actual padded input size
# (1920 x 1920) is declared inside cam0_*.yaml / cam1_*.yaml.
image_width: 600
image_height: 200
show_width: 1080      # SHOW_WIDTH for the show_track visualization

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  trust the matrices below; 1  refine online.

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [
           -9.3884533798356540e-03,  8.7122323988568162e-01,  4.9079723229275929e-01,  5.6679021536248514e-03,
            9.9993523537056150e-01,  5.0221096144328070e-03,  1.0212907492099327e-02, -4.6908385766033012e-02,
            6.4328848548850237e-03,  4.9086132939774207e-01, -8.7121396527737494e-01,  1.1891009071048921e-03,
            0.0000000000000000e+00,  0.0000000000000000e+00,  0.0000000000000000e+00,  1.0000000000000000e+00 ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [
           -7.6486747582769736e-03,  8.7352656991295419e-01,  4.8671637473025203e-01,  5.3927756042940738e-03,
            9.9992801007137622e-01,  2.1812105485422523e-03,  1.1799025182137672e-02,  1.9340324245408366e-02,
            9.2451311049593660e-03,  4.8677158295925610e-01, -8.7348036816759678e-01,  1.4985780407564360e-03,
            0.0000000000000000e+00,  0.0000000000000000e+00,  0.0000000000000000e+00,  1.0000000000000000e+00 ]

#Multiple thread support
multiple_thread: 1
#GPU acceleration
use_gpu: 0
use_vxworks: 0

# Dual-fisheye sub-image flags. Each fisheye camera is unwarped into
# 5 virtual pinhole sub-images (top + 4 sides). For forward-facing stereo
# the "top" sub-image (cam optical axis) is the most useful one.
fisheye_fov: 235.0
enable_up_top: 1
enable_down_top: 1
enable_up_side: 1
enable_down_side: 1
enable_rear_side: 0
thres_outlier: 5.0
tri_max_err: 3.0
pub_flatten: 0
pub_flatten_freq: 10
flatten_color: 0
enable_downsample: 0

enable_depth: 0
rgb_depth_cloud: -1
depth_estimate_baseline: 0.05
depth_config: "depth_cpu.yaml"
top_cnt: 30
side_cnt: 100

#feature tracker parameters
max_cnt: 150
max_solve_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 0
flow_back: 1
enable_perf_output: 0
use_orb: 0

warn_imu_freq: 0
warn_imu_duration: 0
imu_freq: 200
image_freq: 30

#optimization parameters
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

#imu parameters (kalibr-derived, scaled by --imu-noise-scale = 10.0)
acc_n: 0.08485567
gyr_n: 0.06263867
acc_w: 0.00492452
gyr_w: 0.00291066
g_norm: 9.81

#unsynchronization parameters
estimate_td: 1
td: -1.5796349369012135e-02      # kalibr "timeshift_cam_imu"

#loop closure parameters
load_previous_pose_graph: 0
pose_graph_save_path: "/home/lhk/output/pose_graph/"
save_image: 0

#rectify
publish_rectify: 0
cam0_rectify: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 1, 0, 0,
           0, 1, 0,
           0, 0, 1 ]
cam1_rectify: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 1, 0, 0,
           0, 1, 0,
           0, 0, 1 ]
